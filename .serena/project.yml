project_name: venturo-claude
language: typescript
description: Claude Code plugin repository with E2E testing automation framework
type: plugin-development
framework: claude-code

# Project-specific settings
plugin_framework: true
mcp_integration: true
e2e_testing: true

# Source directories
source_dirs:
  - plugins
  - docs

# File patterns to include
include_patterns:
  - "*.ts"
  - "*.js"
  - "*.json"
  - "*.md"
  - "*.yml"
  - "*.yaml"

# Directories to exclude
exclude_dirs:
  - node_modules
  - .git
  - dist
  - build

# Plugin-specific configuration
plugins:
  venturo-e2e-web:
    path: plugins/venturo-e2e-web
    type: claude-code-plugin
    commands:
      - install
      - generate
      - run
      - test
    agents:
      - installer
      - generator
      - runner
      - live-tester